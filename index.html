/* Layout: one-screen phone app, fixed bottom tab bar, scrolling view in the middle. Dark-first (gym lighting), ink-blue neutrals, warm amber accent. */
:root{
  --bg:#0f1216; --surface:#181c23; --surface2:#20262f; --line:#2c333d;
  --fg:#eef1f5; --muted:#9aa4b2; --accent:#f2b544; --accent-fg:#1a1200;
  --good:#5fd38a; --warn:#f2b544; --bad:#f06d6d; --swim:#5bb8f5;
  --skin:#e6b48c; --skin2:#b98860; --shirt:#4f86d8; --shorts:#2b303b; --shoe:#15171b; --hair:#2a1d14; --iron:#8b939e;
  --font:"Vazirmatn",-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#ebe8e1; --line:#d9d4ca;
  --fg:#1b1f26; --muted:#5f6670; --accent:#c57d00; --accent-fg:#ffffff;
  --good:#1f8f4e; --warn:#b36b00; --bad:#c43c3c; --swim:#1f78c2; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#ebe8e1; --line:#d9d4ca;
  --fg:#1b1f26; --muted:#5f6670; --accent:#c57d00; --accent-fg:#ffffff;
  --good:#1f8f4e; --warn:#b36b00; --bad:#c43c3c; --swim:#1f78c2; color-scheme:light; }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
header.top{padding:10px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:var(--bg)}
header.top h1{font-size:18px;margin:0;font-weight:700}
header.top .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 6px;font-size:16px}
.card h3{margin:0 0 4px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;min-height:46px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;font-weight:500}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent)}
.btn:disabled{opacity:.5}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-left:6px;flex:none}
h2 .ic,h3 .ic{color:var(--accent);width:20px;height:20px}
.btn .ic{margin-left:6px}
.pill .ic{width:13px;height:13px;margin-left:3px;vertical-align:-2px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.swim{color:var(--swim);border-color:var(--swim)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:90px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;text-align:right}
.exitem .thumb{width:56px;height:56px;flex:none;background:var(--surface2);border-radius:10px}
.exitem .thumb svg{width:100%;height:100%}
.anim{background:var(--surface2);border-radius:12px;width:100%;aspect-ratio:1.3;max-width:100%;display:block}
.anim svg{width:100%;height:100%;display:block}
.fig{stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig.back{stroke:var(--muted);opacity:.55}
.head{fill:var(--fg)}
.prop{stroke:var(--accent);stroke-width:4;stroke-linecap:round;fill:none}
.propfill{fill:var(--accent)}
.bench{fill:var(--line)}
.floor{stroke:var(--line);stroke-width:2}
.cap{fill:var(--fg);font-size:8.5px;font-family:var(--font);direction:rtl}
ul.tips{margin:6px 0 0;padding-right:18px;font-size:14px}
ul.tips li{margin-bottom:3px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 56px 56px;gap:5px;align-items:center}
.setrow select{padding:8px 2px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;appearance:none;-webkit-appearance:none}
.setrow .n{position:relative}
.pr{position:absolute;top:-10px;right:0;left:0;font-size:9px;font-style:normal;color:var(--accent);font-weight:700}
.warm{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.warmrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;background:none;border:1px dashed var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:13px;text-align:right}
.warmrow .ic{width:16px;height:16px;margin:0;opacity:.3}
.warmrow.ok{border-style:solid;color:var(--fg)}.warmrow.ok .ic{opacity:1;color:var(--good)}
.setrow .n{color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.setrow input{text-align:center;font-variant-numeric:tabular-nums;font-size:17px;padding:8px 4px}
.setrow .done{min-height:44px;padding:6px 2px}
.setrow.ok input{border-color:var(--good)}
.hdr{display:grid;grid-template-columns:30px 1fr 1fr 56px 56px;gap:5px;font-size:11px;color:var(--muted);text-align:center}
.timer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:20px}
.timer .big{font-size:88px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .ring{width:220px;height:220px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;text-align:center}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.gym{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal .d.swim{background:var(--swim);color:#fff;font-weight:700}
.cal .d.ride{border:2px solid var(--swim);color:var(--fg)}
.cal .d.rest{opacity:.6;text-decoration:line-through}
.cal .d.today{outline:2px solid var(--fg)}
.cal .h{color:var(--muted);font-size:10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--font)}
.chart .grid{stroke:var(--line)}
.chart .l1{stroke:var(--accent);stroke-width:2;fill:none}
.chart .l2{stroke:var(--swim);stroke-width:2;fill:none}
.chart .dot1{fill:var(--accent)} .chart .dot2{fill:var(--swim)}
details summary{cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px;left:16px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:60;font-size:14px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700}
.rate{display:flex;gap:4px}
.rate button{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.rate button span{font-size:10px;color:var(--muted)}
.rate button.on{border-color:var(--accent);background:var(--surface)}
.rate button.on span{color:var(--accent)}
.mg{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mg .bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.mg .bar i{display:block;height:100%}
.mg b{font-variant-numeric:tabular-nums;text-align:left}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.alert{border-right:3px solid var(--warn);padding-right:10px;font-size:14px}
@media (prefers-reduced-motion: reduce){ .fig,.prop{transition:none} }

 svgs.forEach(s=>{const id=s.dataset.ex,[a,b]=POSES[id],cyc=id==='bike'||id==='farmer';const per=cyc?1.2:3.2;const raw=(t%per)/per;let k,ph;
  if(cyc){k=raw;ph=Math.floor(t/3)%2;}else{const tri=raw<.5?raw*2:2-raw*2;k=Math.min(1,Math.max(0,(tri-.12)/.76));k=k*k*(3-2*k);ph=raw<.5?0:1;if(raw>.44&&raw<.56)ph=raw<.5?1:1;}
  if(reduced){k=0.5;ph=0;}
  drawPose(s,lerpPose(a,b,k));const cap=s.querySelector('.cap');const txt=CAPS[id]?CAPS[id][ph]:'';if(cap.textContent!==txt)cap.textContent=txt;});}

let actx=null,wl=null;
function beep(n=3){if(!S.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.25;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22);}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
document.addEventListener('touchstart',()=>{try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{once:true,passive:true});
async function wake(on){try{if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}if(!on&&wl){await wl.release();wl=null;}}catch(e){wl=null;}}

function lastSets(exId){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex.find(x=>x.id===exId&&x.sets.some(s=>s.done));if(e)return {sets:e.sets.filter(s=>s.done),date:S.sessions[i].date};}return null;}
function suggest(exId,targetSets){const ex=EX[exId],last=lastSets(exId);if(!last)return {w:null,msg:ex.w0,kind:'new'};
 const [lo,hi]=ex.range,ws=last.sets.map(s=>+s.w||0),w=Math.max(...ws),reps=last.sets.map(s=>+s.r||0);
 const rirs=last.sets.map(s=>s.rir===null||s.rir===undefined?null:+s.rir).filter(x=>x!==null);const easy=rirs.length&&rirs.every(x=>x>=3),hard=rirs.filter(x=>x===0).length>=2;
 const allTop=(last.sets.length>=targetSets&&reps.every(r=>r>=hi))||(easy&&reps.every(r=>r>=lo)),anyLow=reps.filter(r=>r<lo).length>=2||(hard&&reps.some(r=>r<lo));
 const pw=progWeek();const dl=x=>pw.deload&&x?Math.max(0,r25(x*0.9)):x;
 if(PROG.bodyweight.has(exId)){const r=Math.max(...reps);const nxt=allTop?Math.min(hi+ex.inc,hi+ex.inc):r;return {w:null,r:nxt,msg:allTop?`دفعهٔ قبل همهٔ ست‌ها کامل بود؛ این بار ${fa(hi+ex.inc)} ${ex.unit||'تکرار'} بزن.`:`مثل دفعهٔ قبل: ${fa(r)} ${ex.unit||'تکرار'}.`,kind:allTop?'up':'same'};}
 if(pw.deload)return {w:dl(w),msg:`هفتهٔ سبک: ۱۰٪ کمتر از دفعهٔ قبل (${fa(dl(w))} کیلو)، همان تکرارها، تمیز و راحت. هفتهٔ بعد دوباره سنگین می‌شود.`,kind:'deload'};
 if(allTop)return {w:w+ex.inc,msg:easy&&!reps.every(r=>r>=hi)?`دفعهٔ قبل ۳+ تکرار در توان مانده بود؛ ${fa(ex.inc)} کیلو اضافه کن.`:`همهٔ ست‌ها به ${fa(hi)} تکرار رسید؛ ${fa(ex.inc)} کیلو اضافه کن.`,kind:'up'};
 if(anyLow)return {w:Math.max(0,w-ex.inc),msg:`دفعهٔ قبل تکرارها کم شد؛ ${fa(ex.inc)} کیلو کم کن و فرم را درست کن.`,kind:'down'};
 return {w,msg:`همان ${fa(w)} کیلو؛ سعی کن یک تکرار بیشتر از دفعهٔ قبل بزنی.`,kind:'same'};}

function chart(ms){if(ms.length<2)return `<p class="muted">بعد از دومین ثبت، نمودار نشان داده می‌شود.</p>`;

 const ser=(key,cls,dcls)=>{const vs=ms.map(m=>+m[key]);const lo=Math.min(...vs)-1,hi=Math.max(...vs)+1;const y=v=>py+(H-py-22)*(1-(v-lo)/(hi-lo));

let timerI=null;
function restTimer(sec,last){clearInterval(timerI);const o=$('#overlay');let left=sec;const r=100,C=2*Math.PI*r;
 const draw=()=>{o.innerHTML=`<div class="timer"><div class="muted">${last?'استراحت، بعد حرکت بعدی':'استراحت بین ست'}</div>
  <svg class="ring" viewBox="0 0 240 240"><circle cx="120" cy="120" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="10"/><circle cx="120" cy="120" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-left/sec)).toFixed(1)}" transform="rotate(-90 120 120)"/><text x="120" y="138" text-anchor="middle" font-size="56" font-weight="700" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${fa(left)}</text></svg>
  <div class="row"><button class="btn" id="t-less">−۱۵</button><button class="btn" id="t-more">+۱۵</button><button class="btn primary" id="t-skip">آماده‌ام</button></div></div>`;};
 draw();o.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.id==='t-skip'){clearInterval(timerI);o.innerHTML='';o.onclick=null;}if(b.id==='t-less'){left=Math.max(1,left-15);draw();}if(b.id==='t-more'){left+=15;sec=Math.max(sec,left);draw();}};
 timerI=setInterval(()=>{left--;if(left<=0){clearInterval(timerI);beep(3);o.innerHTML='';o.onclick=null;return;}draw();},1000);}
function confirmBox(msg,yes){const o=$('#overlay');o.innerHTML=`<div class="timer" style="background:rgba(0,0,0,.6)"><div class="card" style="max-width:320px"><p style="margin:0 0 12px">${msg}</p><div class="row"><button class="btn grow" id="c-no">نه</button><button class="btn danger grow" id="c-yes">بله</button></div></div></div>`;
 o.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;o.innerHTML='';o.onclick=null;if(b.id==='c-yes')yes();};}

/* ---------- bindings for tabs ---------- */
function tabClick(ev){const m=$('#main');{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.goto){tab=b.dataset.goto;render();return;}
  if(b.dataset.start){startWorkout(b.dataset.start,b.dataset.short==='1');}
  if(b.dataset.act){const t=todayISO();S.activities=S.activities.filter(a=>a.date!==t);S.activities.push({date:t,type:b.dataset.act});save();render();toast('ثبت شد');}
  if(b.dataset.ex){const c=document.createElement('div');c.innerHTML=exDetail(b.dataset.ex);const card=c.firstElementChild;card.style.marginBottom='12px';m.prepend(card);m.scrollTop=0;}
  if(b.hasAttribute('data-close')){b.closest('.card').remove();}
  if(b.id==='m-save'){const w=+$('#m-w').value,waist=+$('#m-waist').value,abd=+$('#m-abd').value,date=$('#m-date').value;if(!w||!abd){toast('وزن و دور شکم لازم است');return;}S.measures=S.measures.filter(x=>x.date!==date);S.measures.push({date,weight:w,waist:waist||null,abd});save();render();toast('ثبت شد');}
  if(b.dataset.delm){confirmBox('این اندازه حذف شود؟',()=>{S.measures=S.measures.filter(x=>x.date!==b.dataset.delm);save();render();});}
  if(b.dataset.dels){confirmBox('این جلسه حذف شود؟',()=>{S.sessions=S.sessions.filter(x=>String(x.id)!==b.dataset.dels);save();render();});}
  if(b.id==='b-copy'){const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>toast('کپی شد. در یادداشت‌ها ذخیره‌اش کن.')).catch(()=>{$('#b-text').value=txt;$('#b-text').select();toast('متن را دستی کپی کن');});}
  if(b.id==='b-show'){$('#b-text').value=JSON.stringify(S);$('#b-text').select();}
  if(b.id==='b-import'){try{const d=JSON.parse($('#b-text').value);if(!d.sessions||!d.measures)throw 0;S=Object.assign({},DEFAULT,d);save();render();toast('بازگردانی شد');}catch(e){toast('متن پشتیبان معتبر نیست');}}
  if(b.id==='s-reset'){confirmBox('همهٔ جلسه‌ها و اندازه‌ها پاک شود؟',()=>{S=JSON.parse(JSON.stringify(DEFAULT));save();render();});}
 }}
function tabChange(ev){{const t=ev.target;if(t.id==='p-h'){S.profile.height=+t.value||null;save();render();}if(t.id==='p-age'){S.profile.age=+t.value||null;save();}if(t.id==='s-sound'){S.settings.sound=t.checked;save();}if(t.id==='s-wake'){S.settings.wake=t.checked;save();}if(t.id==='s-rest'){S.settings.restScale=+t.value;save();}}}
$('#main').addEventListener('click',ev=>S.live?liveClick(ev):tabClick(ev));
$('#main').addEventListener('input',ev=>{if(S.live)liveInput(ev);});
$('#main').addEventListener('change',ev=>{if(!S.live)tabChange(ev);else liveInput(ev);});

load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
